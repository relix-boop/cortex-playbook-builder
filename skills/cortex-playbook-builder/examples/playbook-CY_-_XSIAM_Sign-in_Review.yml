      version: -1
      name: XQL sign-in countries for user
      description: 'Polling command: waits for the XQL result. One query per alert (quota).'
      script: '|||xdr-xql-generic-query'
      iscommand: true
      brand: ''
      type: regular
    separatecontext: false
