    scriptarguments:
      query_name:
        simple: cy_signin_countries_${alert.id}
      time_frame:
        simple: ${inputs.Days} days
      query:
        simple: dataset = authentication_story | alter u = lowercase(json_extract_scalar(auth_normalized_user, "$.username")) | filter u != null and lowercase("${inputs.Username}") contains u | comp count() as logins by action_country | sort desc logins | limit 50
    continueonerror: true
    nexttasks:
